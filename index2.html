<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maryam's Birthday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Tenor+Sans&display=swap">

<style>
/* ─── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --bg:        #0e0205;
  --maroon:    #5c0a1a;
  --red:       #9b1d2e;
  --offwhite:  #f2ece4;
  --silver:    #c8cdd4;
  --silver-d:  #8a9099;
  --curtain:   #3a0610;
  --curtain-h: #5a0e1e;
  --script:    'Great Vibes', cursive;
  --serif:     'Cormorant Garamond', Georgia, serif;
  --sans:      'Tenor Sans', 'Helvetica Neue', sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

html, body {
  height: 100%;
  overflow-x: hidden;
}

body {
  background: #1e0308;
  color: var(--offwhite);
  font-family: var(--sans);
  padding-left:  max(0px, env(safe-area-inset-left,  0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}

/* ─── Stage (curtain scene) ─────────────────────────────────────────── */
#stage {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  pointer-events: none;
  overflow: hidden;
}

/* Curtain halves */
.curtain {
  width: 52%;
  height: 100%;
  position: relative;
  transition: transform 2.2s cubic-bezier(0.76, 0, 0.24, 1) 0.4s;
  will-change: transform;
  overflow: hidden;
}

.curtain-left  { transform-origin: left center; }
.curtain-right { transform-origin: right center; margin-left: auto; }

#stage.opened .curtain-left  { transform: translateX(-100%); }
#stage.opened .curtain-right { transform: translateX(100%); }

/* Realistic velvet curtain — left */
/* Mimics the reference: deep red with bright vertical highlight in centre, dark edges */
.curtain-left {
  background:
    linear-gradient(90deg,
      #0a0002 0%,
      #1a0308 8%,
      #3a0810 20%,
      #6e1220 32%,
      #8c1828 42%,
      #7a1422 50%,
      #5a0e18 58%,
      #3a0810 68%,
      #1a0308 82%,
      #0a0002 100%
    );
}

.curtain-right {
  background:
    linear-gradient(90deg,
      #0a0002 0%,
      #1a0308 18%,
      #3a0810 32%,
      #5a0e18 42%,
      #7a1422 50%,
      #8c1828 58%,
      #6e1220 68%,
      #3a0810 80%,
      #1a0308 92%,
      #0a0002 100%
    );
}

/* Fine vertical fabric grain */
.curtain-left .folds,
.curtain-right .folds {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    90deg,
    rgba(255,255,255,0.03)  0px,
    rgba(0,0,0,0.1)         1.5px,
    rgba(255,255,255,0.015) 3px,
    rgba(0,0,0,0.06)        5px,
    rgba(255,255,255,0.02)  7px,
    rgba(0,0,0,0.08)        9px,
    rgba(255,255,255,0.01)  11px,
    rgba(0,0,0,0.05)        14px
  );
}

/* Deep shadow at inner edges where curtains meet */
.curtain-left::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 50px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.6));
}
.curtain-right::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 50px;
  background: linear-gradient(270deg, transparent, rgba(0,0,0,0.6));
}

/* Bottom hem shadow */
.curtain::before {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 100px;
  background: linear-gradient(0deg, rgba(0,0,0,0.4), transparent);
  pointer-events: none;
}

/* Spotlight glow in the centre gap between curtains */
#stage::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  background: radial-gradient(ellipse at 50% 40%, rgba(160,40,40,0.18) 0%, transparent 70%);
  pointer-events: none;
  z-index: 5;
}

/* ─── Tap prompt ────────────────────────────────────────────────────── */
#tap-prompt {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  cursor: pointer;
  pointer-events: all;
}

#tap-prompt.hidden { display: none; }

.tap-script {
  font-family: var(--script);
  font-size: clamp(2.2rem, 10vw, 3.2rem);
  background: linear-gradient(120deg, #c8cdd4 0%, #ffffff 40%, #9b1d2e 60%, #c8cdd4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 250% 250%;
  background-position: 100% 50%;
  animation: shimmer 4s ease-in-out infinite;
  line-height: 1.2;
}

.tap-hint {
  font-family: var(--sans);
  font-size: 0.58rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--silver-d);
  animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.5; }
  50%       { opacity: 1; }
}

/* ─── Invite scroll (the actual invite content) ─────────────────────── */
#invite {
  position: relative;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.8s ease 2.2s;
  pointer-events: none;
}

#invite.visible {
  opacity: 1;
  pointer-events: all;
}

/* ─── Page ──────────────────────────────────────────────────────────── */
.page {
  max-width: 420px;
  margin: 0 auto;
  padding-top: 64px;
  padding-bottom: 80px;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

/* ─── Ornament ──────────────────────────────────────────────────────── */
.ornament {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin-bottom: 36px;
  opacity: 0;
  animation: fadeIn 1s ease 2.6s forwards;
}
.ornament-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,205,212,0.3));
}
.ornament-line.right {
  background: linear-gradient(270deg, transparent, rgba(200,205,212,0.3));
}
.ornament-diamond {
  width: 5px; height: 5px;
  background: var(--silver);
  transform: rotate(45deg);
  opacity: 0.5;
}

/* ─── Eyebrow ───────────────────────────────────────────────────────── */
.eyebrow {
  font-family: var(--sans);
  font-size: 0.6rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--silver-d);
  opacity: 0;
  animation: fadeIn 1s ease 2.8s forwards;
  margin-bottom: 28px;
}

/* ─── Invite text stack ─────────────────────────────────────────────── */

/* Line 1: "you are invited to" — tiny spaced caps */
.line-invited {
  font-family: var(--sans);
  font-size: 0.6rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  color: var(--silver-d);
  opacity: 0;
  animation: fadeIn 1s ease 2.6s forwards;
  margin-bottom: 16px;
}

/* Line 2: "A New Era of" — medium elegant serif italic */
.line-era {
  font-family: var(--serif);
  font-weight: 300;
  font-style: italic;
  font-size: clamp(1.15rem, 4.5vw, 1.5rem);
  color: var(--offwhite);
  letter-spacing: 0.04em;
  opacity: 0;
  animation: fadeUp 1s ease 2.9s forwards;
  margin-bottom: 6px;
}

/* Line 3: "Maryam" — the hero, large script with shimmer */
.line-name {
  font-family: var(--script);
  font-size: clamp(4.5rem, 19vw, 6.5rem);
  line-height: 1;
  background: linear-gradient(120deg, #f2ece4 0%, #ffffff 35%, #c8cdd4 55%, #f2ece4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 250% 250%;
  background-position: 100% 50%;
  opacity: 0;
  animation: fadeUp 1.2s ease 3.2s forwards, shimmer 5s ease-in-out 4.8s infinite;
  margin-bottom: 16px;
}

/* Line 4: "Being Twenty Five" — small serif, spaced */
.line-age {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(0.85rem, 3vw, 1rem);
  letter-spacing: 0.18em;
  color: var(--silver-d);
  opacity: 0;
  animation: fadeIn 1s ease 3.8s forwards;
  margin-bottom: 48px;
}

/* ─── Rule ──────────────────────────────────────────────────────────── */
.rule {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,205,212,0.35), transparent);
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeIn 1s ease 4s forwards;
}

/* ─── Body text ─────────────────────────────────────────────────────── */
.body-text {
  font-family: var(--serif);
  font-size: clamp(0.95rem, 3.5vw, 1.1rem);
  font-weight: 300;
  line-height: 1.9;
  color: var(--offwhite);
  opacity: 0;
  animation: fadeUp 1s ease 4.2s forwards;
  margin-bottom: 44px;
  max-width: 300px;
}

/* ─── Details ───────────────────────────────────────────────────────── */
.details {
  width: 100%;
  border-top: 1px solid rgba(200,205,212,0.1);
  border-bottom: 1px solid rgba(200,205,212,0.1);
  padding-block: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  opacity: 0;
  animation: fadeUp 1s ease 4.5s forwards;
  margin-bottom: 44px;
}
.detail-row { display: flex; flex-direction: column; gap: 5px; }
.detail-label {
  font-family: var(--sans);
  font-size: 0.52rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--silver-d);
}
.detail-value {
  font-family: var(--serif);
  font-size: 1.05rem;
  font-weight: 400;
  color: var(--offwhite);
  letter-spacing: 0.02em;
}

/* ─── Surprise (footer) ─────────────────────────────────────────────── */
.surprise {
  font-family: var(--script);
  font-size: 1.6rem;
  background: linear-gradient(120deg, #c8cdd4 0%, #ffffff 40%, #9b1d2e 60%, #c8cdd4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 250% 250%;
  background-position: 100% 50%;
  opacity: 0;
  animation: fadeIn 1.5s ease 4.8s forwards, shimmer 5s ease-in-out 6s infinite;
  margin-bottom: 36px;
}

/* ─── Bottom ornament ───────────────────────────────────────────────── */
.ornament-bottom {
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  animation: fadeIn 1s ease 5.2s forwards;
}
.ornament-bottom span {
  font-size: 0.5rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--silver-d);
}

/* ─── Keyframes ─────────────────────────────────────────────────────── */
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0%   { background-position: 100% 50%; }
  50%  { background-position:   0% 50%; }
  100% { background-position: 100% 50%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>

<!-- ── Curtain stage ─────────────────────────────────────────────────── -->
<div id="stage">
  <div class="curtain curtain-left"><div class="folds"></div></div>
  <div class="curtain curtain-right"><div class="folds"></div></div>
</div>

<!-- ── Tap to reveal prompt ─────────────────────────────────────────── -->
<div id="tap-prompt" role="button" aria-label="Tap to open invitation" tabindex="0">
  <div class="tap-script">Shhh, it's a surprise</div>
  <p class="tap-hint">tap to reveal</p>
</div>

<!-- ── The invite ───────────────────────────────────────────────────── -->
<div id="invite">
  <div class="page">

    <div class="ornament" aria-hidden="true">
      <div class="ornament-line"></div>
      <div class="ornament-diamond"></div>
      <div class="ornament-line right"></div>
    </div>

    <p class="line-invited">You are invited to</p>
    <p class="line-era">A New Era of</p>
    <div class="line-name">Maryam</div>
    <p class="line-age">Being Twenty Five</p>

    <div class="rule" aria-hidden="true"></div>

    <p class="body-text">
      Join us for an intimate afternoon<br>
      to celebrate Maryam's twenty fifth birthday
    </p>

    <div class="details">
      <div class="detail-row">
        <span class="detail-label">Date</span>
        <span class="detail-value">Saturday, 24th October</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Time</span>
        <span class="detail-value">4:00 — 7:00 pm</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Venue</span>
        <span class="detail-value">The Artistry Club</span>
      </div>
    </div>

    <div class="surprise">Shhh, it's a surprise</div>

    <div class="ornament-bottom" aria-hidden="true">
      <div class="ornament-diamond"></div>
      <span>with love</span>
      <div class="ornament-diamond"></div>
    </div>

  </div>
</div>

<script>
const stage  = document.getElementById('stage');
const prompt = document.getElementById('tap-prompt');
const invite = document.getElementById('invite');
function openCurtains() {
  prompt.classList.add('hidden');
  stage.classList.add('opened');
  invite.classList.add('visible');
}

prompt.addEventListener('click', openCurtains);
prompt.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') openCurtains();
});
</script>

</body></html>
